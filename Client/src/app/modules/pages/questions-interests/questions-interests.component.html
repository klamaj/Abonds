<div class="p-4 w-full flex justify-center">
    <div class="w-full lg:max-w-[700px]">
        <div class="w-full px-4 flex justify-center items-center">
            <p class="text-2xl text-[#666666] lg:hidden">Questions & Interests</p>
        </div>

        <div class="flex justify-center items-center pt-12 lg:pt-0 w-full">
            <div class="p-1 rounded-full bg-[#E6E6E6] w-max flex justify-center items-center gap-1">
                <button
                    type="button"
                    [ngClass]="[pill == 'questions' ? 'bg-white' : 'bg-transparent']"
                    class="rounded-full text-sm flex justify-center items-center h-10 w-full px-6 py-3"
                    (click)="pill = 'questions' "
                    >
                    Questions
                </button>
                <button
                    type="button"
                    [ngClass]="[pill == 'interests' ? 'bg-white' : 'bg-transparent']"
                    class="rounded-full text-sm flex justify-center items-center h-10 w-full px-6 py-3"
                    (click)="pill = 'interests'"
                    >
                    Interests
                </button>
            </div>
        </div>
        
        <div class="w-full p-4">
            <app-interests *ngIf="pill == 'interests' "></app-interests>
            <app-questions *ngIf="pill == 'questions' "></app-questions>
        </div>
    </div>
</div>
