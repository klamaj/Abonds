<div class="w-full mt-20">

    <div class="space-y-8" *ngIf="questionID == 0">
        <!-- Question's Categories -->
        <div class="bg-white border-2 border-[#E6E6E6] rounded-xl p-4 pt-6 cursor-pointer hover:border-black relative">
            <!-- trash icon -->
            <div class="absolute top-6 right-4">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_125_453)">
                        <path d="M20.25 5.25H3.75" stroke="#808080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9.75 9.75V15.75" stroke="#808080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14.25 9.75V15.75" stroke="#808080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M18.75 5.25V19.5C18.75 19.6989 18.671 19.8897 18.5303 20.0303C18.3897 20.171 18.1989 20.25 18 20.25H6C5.80109 20.25 5.61032 20.171 5.46967 20.0303C5.32902 19.8897 5.25 19.6989 5.25 19.5V5.25" stroke="#808080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15.75 5.25V3.75C15.75 3.35218 15.592 2.97064 15.3107 2.68934C15.0294 2.40804 14.6478 2.25 14.25 2.25H9.75C9.35218 2.25 8.97064 2.40804 8.68934 2.68934C8.40804 2.97064 8.25 3.35218 8.25 3.75V5.25" stroke="#808080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                    <defs>
                        <clipPath id="clip0_125_453">
                            <rect width="24" height="24" fill="white"/>
                        </clipPath>
                    </defs>
                </svg>
            </div>
            <!-- Question content -->
            <div class="flex flex-col justify-between gap-12">
                <div>
                    <p class="text-lg font-bold">Client's questions</p>
                    <p class="text-sm">These questions are for...</p>
                </div>
                <div class="w-full text-right">
                    <p class="text-[#808080] text-xs">Created by username</p>
                </div>
            </div>
        </div>

        <!-- Add Question Category -->
        <div class="bg-transparent rounded-xl border-2 border-[#E6E6E6] p-4 pt-6 cursor-pointer hover:border-black">
            <div class="flex w-full justify-center">
                <svg class="text-center" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_125_472)">
                        <path d="M32 56C45.2548 56 56 45.2548 56 32C56 18.7452 45.2548 8 32 8C18.7452 8 8 18.7452 8 32C8 45.2548 18.7452 56 32 56Z" stroke="black" stroke-width="2" stroke-miterlimit="10"/>
                        <path d="M22 32H42" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M32 22V42" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                    <defs>
                        <clipPath id="clip0_125_472">
                            <rect width="64" height="64" fill="white"/>
                        </clipPath>
                    </defs>
                </svg>
            </div>
            <p class="pt-4 text-lg font-bold">Add new quetion's category</p>
            <p class="text-[#808080] text-sm">Add alternative questions</p>
        </div>
    </div>

    <app-question-category [questionID]="questionID" *ngIf="questionID != 0"></app-question-category>

</div>
