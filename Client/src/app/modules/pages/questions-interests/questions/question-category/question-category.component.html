<div class="w-full">

    <form #f="ngForm" [formGroup]="categoryQuestionForm" class="w-full">
        <div class="grid space-y-3">
            <!-- Question Category Title -->
            <div class="relative">
                <input
                    type="text" 
                    id="title"
                    formControlName="title"
                    [ngClass]="[categoryQuestionForm.controls['title'].invalid && (categoryQuestionForm.controls['title'].touched || categoryQuestionForm.controls['title'].dirty) ? 'ring-[#FF1941] ring-2 focus:ring-[#FF1941]' : '']"
                    class="block rounded-[10px] h-12 w-full text-sm text-black text-bold bg-[#E6E6E6] border-none appearance-none  focus:ring-black focus:ring-2 peer" placeholder=" " />
                <label 
                    for="title"
                    class="absolute text-sm text-[#808080] duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-3 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                    Question's category title
                </label>
            </div>
            <!-- Category Question Description -->
            <!-- <div class="relative">
                <input
                    type="text" 
                    id="categoryDescription"
                    formControlName="categoryDescription"
                    [ngClass]="[categoryQuestionForm.controls['categoryDescription'].invalid && (categoryQuestionForm.controls['categoryDescription'].touched || categoryQuestionForm.controls['categoryDescription'].dirty) ? 'ring-[#FF1941] ring-2 focus:ring-[#FF1941]' : '']"
                    class="block rounded-[10px] h-12 w-full text-sm text-black text-bold bg-[#E6E6E6] border-none appearance-none  focus:ring-black focus:ring-2 peer" placeholder=" " />
                <label 
                    for="categoryDescription"
                    class="absolute text-sm text-[#808080] duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-3 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                    Question's category description
                </label>
            </div> -->
            <app-question-form formControlName="questions"></app-question-form>
        </div>
    </form>
</div>
