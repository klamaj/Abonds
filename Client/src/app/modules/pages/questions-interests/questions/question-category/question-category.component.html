<div class="w-full flex justify-center items-start">

    <div class="w-full max-w-[1120px]">
        
        <!-- question categories -->
        <div class="grid grid-cols-2 gap-10">

            <div *ngFor="let item of questions$ | async" class="p-6 bg-white rounded-[20px] w-full">
                <p class="text-[20px] font-bold">{{ item.questionCategoryTitle }}</p>
                <!-- <p class="pt-3 text-sm">These questions are for ...</p> -->
                <p class="pt-16 text-right text-[#808080] text-xs">Created by lila</p>
            </div>

            <!-- Add Question Category -->
            <div class="px-6 pt-8 pb-6 rounded-[20px] w-full border-2 border-[#E6E6E6] hover:border-black cursor-pointer">
                <div class="w-full flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <g clip-path="url(#clip0_18_290)">
                            <path d="M32 56C45.2548 56 56 45.2548 56 32C56 18.7452 45.2548 8 32 8C18.7452 8 8 18.7452 8 32C8 45.2548 18.7452 56 32 56Z" stroke="black" stroke-width="2" stroke-miterlimit="10"/>
                            <path d="M22 32H42" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M32 22V42" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                        <defs>
                            <clipPath id="clip0_18_290">
                            <rect width="64" height="64" fill="white"/>
                            </clipPath>
                        </defs>
                    </svg>
                </div>
                <div class="pt-9">
                    <p class="text-xl font-bold">Add Questions Category</p>
                    <p class="text-[#808080] text-sm">Add other questions</p>
                </div>
            </div>
        </div>
    </div>
</div>
