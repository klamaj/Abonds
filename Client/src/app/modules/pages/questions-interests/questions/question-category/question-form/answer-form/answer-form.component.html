
<div class="flex items-center gap-4 mt-8">
    <!-- radio -->
    <svg *ngIf="this.type == 'radio'" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="9" stroke="#B3B3B3" stroke-width="2"/>
    </svg>
    <!-- checkbox -->
    <svg *ngIf="this.type == 'checkbox'" width="19" height="20" viewBox="0 0 19 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="17" height="18" rx="4" stroke="#B3B3B3" stroke-width="2"/>
    </svg>
    <p class="text-[#808080] text-sm">Add answer</p>
</div>
