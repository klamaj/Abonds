<div class="w-full mt-20">
    <div class="grid space-y-3">

        <div *ngFor="let interest of interests$ | async" class="w-full">
            <div
            [style.border]="'2px solid' + interest.interestColor"
            class="rounded-[20px] w-full">
                <div [style.background]="interest.interestColor" class="w-full rounded-t-[20px] -mt-1 p-4 flex justify-between items-center">
                    <div>
                        <p>{{interest.interestName}}</p>
                    </div>
                    <div class="flex justify-end items-center gap-5 w-max">
                        <!-- pencil -->
                        <svg (click)="showInterestForm(interest)"  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <g clip-path="url(#clip0_178_254)">
                                <path d="M8.68969 20.2501H4.5C4.30109 20.2501 4.11032 20.1711 3.96967 20.0305C3.82902 19.8898 3.75 19.699 3.75 19.5001V15.3104C3.75009 15.1118 3.82899 14.9213 3.96938 14.7807L15.5306 3.2195C15.6713 3.07895 15.862 3 16.0608 3C16.2596 3 16.4503 3.07895 16.5909 3.2195L20.7806 7.40637C20.9212 7.54701 21.0001 7.7377 21.0001 7.93653C21.0001 8.13535 20.9212 8.32605 20.7806 8.46668L9.21937 20.0307C9.07883 20.1711 8.88834 20.25 8.68969 20.2501Z" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12.75 6L18 11.25" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M15.375 8.625L6.375 17.625" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8.95125 20.2013L3.79688 15.0469" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                            <defs>
                                <clipPath id="clip0_178_254">
                                <rect width="24" height="24" fill="white"/>
                                </clipPath>
                            </defs>
                        </svg>
                        <!-- add sub -->
                        <p class="text-2xl" (click)="showSubInt(interest)">+</p>
                        <!-- delete -->
                        <svg (click)="deleteInterest(interest.id)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <g clip-path="url(#clip0_178_260)">
                                <path d="M20.25 5.25H3.75" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9.75 9.75V15.75" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M14.25 9.75V15.75" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M18.75 5.25V19.5C18.75 19.6989 18.671 19.8897 18.5303 20.0303C18.3897 20.171 18.1989 20.25 18 20.25H6C5.80109 20.25 5.61032 20.171 5.46967 20.0303C5.32902 19.8897 5.25 19.6989 5.25 19.5V5.25" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M15.75 5.25V3.75C15.75 3.35218 15.592 2.97064 15.3107 2.68934C15.0294 2.40804 14.6478 2.25 14.25 2.25H9.75C9.35218 2.25 8.97064 2.40804 8.68934 2.68934C8.40804 2.97064 8.25 3.35218 8.25 3.75V5.25" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                            <defs>
                                <clipPath id="clip0_178_260">
                                <rect width="24" height="24" fill="white"/>
                                </clipPath>
                            </defs>
                        </svg>
                    </div>
                </div>
                <div class="flex flex-wrap p-4 pb-2 gap-3">
                    <!-- here -->
                    <div [style.background]="interest.interestColor"  *ngFor="let item of interest.subInterests" class="rounded-full p-1 flex justify-start items-center w-max gap-4">
                        <p class="text-sm">{{ item.subInterestName }}</p>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <g clip-path="url(#clip0_178_295)">
                                <path d="M15 9L9 15" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9 9L15 15" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21Z" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                            <defs>
                                <clipPath id="clip0_178_295">
                                <rect width="24" height="24" fill="white"/>
                                </clipPath>
                            </defs>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add new interest Form -->
        <div *ngIf="newIntDisp">
            <div class="w-full bg-[white] rounded-[20px] px-4 py-6">
                <form #f="ngForm" [formGroup]="newInterestForm" (ngSubmit)="newInterest()">
                    <div class="grid space-y-3 w-full">
                        <!-- name -->
                        <div class="relative">
                            <input
                                type="text" 
                                id="interestName"
                                formControlName="interestName"
                                [ngClass]="[newInterestForm.controls['interestName'].invalid && (newInterestForm.controls['interestName'].touched || newInterestForm.controls['interestName'].dirty) ? 'ring-[#FF1941] ring-2 focus:ring-[#FF1941]' : '']"
                                class="block rounded-[10px] h-12 w-full text-sm text-black text-bold bg-[#E6E6E6] border-none appearance-none  focus:ring-black focus:ring-2 peer" placeholder=" " />
                            <label 
                                for="interestName"
                                class="absolute text-sm text-[#808080] duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-3 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                                Interest category
                            </label>
                        </div>
                        <!-- Hex Code -->
                        <div class="relative">
                            <input
                                type="text" 
                                id="interestColor"
                                formControlName="interestColor"
                                [ngClass]="[newInterestForm.controls['interestColor'].invalid && (newInterestForm.controls['interestColor'].touched || newInterestForm.controls['interestColor'].dirty) ? 'ring-[#FF1941] ring-2 focus:ring-[#FF1941]' : '']"
                                class="block rounded-[10px] h-12 w-full text-sm text-black text-bold bg-[#E6E6E6] border-none appearance-none  focus:ring-black focus:ring-2 peer" placeholder=" " />
                            <label 
                                for="interestColor"
                                class="absolute text-sm text-[#808080] duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-3 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                                Color (Hex Code)
                            </label>
                        </div>
                        <button type="submit" class="w-full max-w-52 h-12 bg-black text-white text-sm font-bold rounded-full">Save</button>
                    </div>
                </form>
            </div>
        </div>

        <div (click)="newIntDisp=true" class="bg-transparent rounded-xl border-2 border-[#E6E6E6] p-4 pt-6 cursor-pointer hover:border-black">
            <div class="flex w-full justify-center">
                <svg class="text-center" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_125_472)">
                        <path d="M32 56C45.2548 56 56 45.2548 56 32C56 18.7452 45.2548 8 32 8C18.7452 8 8 18.7452 8 32C8 45.2548 18.7452 56 32 56Z" stroke="black" stroke-width="2" stroke-miterlimit="10"/>
                        <path d="M22 32H42" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M32 22V42" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                    <defs>
                        <clipPath id="clip0_125_472">
                            <rect width="64" height="64" fill="white"/>
                        </clipPath>
                    </defs>
                </svg>
            </div>
            <p class="pt-4 text-lg font-bold">Add new Interest's category</p>
        </div>
    </div>
</div>


<!-- Update Interest -->
<div *ngIf="updateIntDisp"  class="z-[1000] absolute top-0 left-0 bg-[#F6F6F6B2] flex justify-center items-center w-full lg:h-full p-4 h-screen">

        <div class="w-full bg-[white] rounded-[20px] px-4 py-6">
            <form #f="ngForm" [formGroup]="updateInterestForm" (ngSubmit)="updateInterest()">
                <div class="grid space-y-3 w-full">
                    <!-- name -->
                    <div class="relative">
                        <input
                            type="text" 
                            id="interestName"

                            Interest category
                        </label>
                    </div>
                    <!-- Hex Code -->

                            class="block rounded-[10px] h-12 w-full text-sm text-black text-bold bg-[#E6E6E6] border-none appearance-none  focus:ring-black focus:ring-2 peer" placeholder=" " />
                        <label 
                            for="interestColor"
                            class="absolute text-sm text-[#808080] duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-3 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                            Color (Hex code)
                        </label>
                    </div>
                    <button type="submit" class="w-full max-w-52 h-12 bg-black text-white text-sm font-bold rounded-full">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- add subInt -->
<div *ngIf="subIntAddDisp"  class="z-[1000] absolute top-0 left-0 bg-[#F6F6F6B2] flex justify-center items-center w-full lg:h-full p-4 h-screen">
    <div class="w-full lg:max-w-[400px] flex justify-center items-center h-full">
        <div class="w-full bg-[white] rounded-[20px] px-4 py-6">
            <form #f="ngForm" [formGroup]="subInterestForm" (ngSubmit)="addSubInterest()">
                <div class="grid space-y-3 w-full">
                    <!-- name -->
                    <div class="relative">
                        <input
                            type="text" 
                            id="subInterestName"
                            formControlName="subInterestName"
                            [ngClass]="[subInterestForm.controls['subInterestName'].invalid && (subInterestForm.controls['subInterestName'].touched || subInterestForm.controls['subInterestName'].dirty) ? 'ring-[#FF1941] ring-2 focus:ring-[#FF1941]' : '']"
                            class="block rounded-[10px] h-12 w-full text-sm text-black text-bold bg-[#E6E6E6] border-none appearance-none  focus:ring-black focus:ring-2 peer" placeholder=" " />
                        <label 
                            for="interestName"
                            class="absolute text-sm text-[#808080] duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-3 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                            Interest
                        </label>
                    </div>
                    <button type="submit" class="w-full max-w-52 h-12 bg-black text-white text-sm font-bold rounded-full">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
